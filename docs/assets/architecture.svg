<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="t d">
<title id="t">AgriVision architecture</title><desc id="d">Animated architecture: the browser app, Firebase (Auth, Storage, Functions, Firestore), the AI agents and the external data services, with animated data flows.</desc>
<defs><marker id="arr-2f6b3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6b3a"/></marker><marker id="arr-e07a1f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e07a1f"/></marker><marker id="arr-3b7bb8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b7bb8"/></marker><marker id="arr-8a4fc0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a4fc0"/></marker><style>
text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.dash{animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.glow{animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
</style></defs>
<rect width="1280" height="850" fill="#f6f8f2"/>
<text x="640" y="32" text-anchor="middle" font-size="22" font-weight="800" fill="#173d24">AgriVision architecture</text>
<rect x="340" y="56" width="580" height="734" rx="22" fill="#fffaf0" stroke="#f0a92a" stroke-width="2" stroke-dasharray="2 0"/><text x="360" y="84" font-size="16" font-weight="800" fill="#b86e00">Firebase (asia-south1)</text><rect x="950" y="56" width="300" height="734" rx="22" fill="#eef4fb" stroke="#3b7bb8" stroke-width="2"/><text x="970" y="84" font-size="16" font-weight="800" fill="#245a91">Google / open data services</text><rect x="30" y="330" width="270" height="250" rx="14" fill="#e6f0e3" stroke="#2f6b3a" stroke-width="1.6"/><text x="44" y="354" font-size="15" font-weight="700" fill="#173d24">Next.js 14 app (Vercel)</text><text x="44" y="376" font-size="12.5" fill="#4a5f4d">Diagnose · Map · Reports · Alerts</text><text x="44" y="394" font-size="12.5" fill="#4a5f4d">My Reports · Profile · Login</text><text x="44" y="412" font-size="12.5" fill="#4a5f4d">Weather card + live weather backdrop</text><text x="44" y="430" font-size="12.5" fill="#4a5f4d">Tailwind v4 · Motion · Lenis</text><text x="44" y="448" font-size="12.5" fill="#4a5f4d">9 languages (en hi mr ta te bn gu kn pa)</text><text x="44" y="466" font-size="12.5" fill="#4a5f4d">Realtime Firestore listeners</text><g transform="translate(60 528)"><rect width="210" height="34" rx="17" fill="#2f6b3a"/><text x="105" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Farmer / researcher browser</text></g><rect x="364" y="104" width="250" height="84" rx="14" fill="#fff" stroke="#2f6b3a" stroke-width="1.6"/><text x="378" y="128" font-size="15" font-weight="700" fill="#173d24">Firebase Auth</text><text x="378" y="150" font-size="12.5" fill="#4a5f4d">Phone number + SMS code (OTP)</text><text x="378" y="168" font-size="12.5" fill="#4a5f4d">gates uploads, /alerts, profile</text><rect x="364" y="206" width="250" height="98" rx="14" fill="#fff" stroke="#2f6b3a" stroke-width="1.6"/><text x="378" y="230" font-size="15" font-weight="700" fill="#173d24">Cloud Storage  uploads/</text><text x="378" y="252" font-size="12.5" fill="#4a5f4d">create-only, images &lt; 8 MB</text><text x="378" y="270" font-size="12.5" fill="#4a5f4d">rule: phone login + uid == auth.uid</text><text x="378" y="288" font-size="12.5" fill="#4a5f4d">model files in models/</text><rect x="646" y="104" width="250" height="200" rx="14" fill="#fff" stroke="#2f6b3a" stroke-width="1.6"/><text x="660" y="128" font-size="15" font-weight="700" fill="#173d24">Cloud Firestore</text><text x="660" y="150" font-size="12.5" fill="#4a5f4d">reports  (public read)</text><text x="660" y="168" font-size="12.5" fill="#4a5f4d">users/{uid}  (owner only)</text><text x="660" y="186" font-size="12.5" fill="#4a5f4d">uploadErrors  (public read)</text><text x="660" y="204" font-size="12.5" fill="#4a5f4d">writes only from Functions</text><text x="660" y="222" font-size="12.5" fill="#4a5f4d">(admin SDK) — clients: none</text><text x="660" y="240" font-size="12.5" fill="#4a5f4d">Realtime snapshots to the app</text><rect x="364" y="328" width="532" height="236" rx="16" fill="#fff" stroke="#f0a92a" stroke-width="1.6"/><text x="378" y="352" font-size="15" font-weight="700" fill="#7a4a00">Cloud Functions (Node 22, TypeScript)</text><g><rect x="378" y="366" width="130" height="26" rx="13" fill="#fde3b0" stroke="#f0a92a"/><text x="443.0" y="383.5" font-size="12" font-weight="600" text-anchor="middle" fill="#7a4a00">processUpload</text></g><g><rect x="516" y="366" width="168" height="26" rx="13" fill="#fff3d6" stroke="#f0a92a"/><text x="600.0" y="383.5" font-size="12" font-weight="600" text-anchor="middle" fill="#7a4a00">scheduledTrendCheck</text></g><g><rect x="692" y="366" width="130" height="26" rx="13" fill="#fff3d6" stroke="#f0a92a"/><text x="757.0" y="383.5" font-size="12" font-weight="600" text-anchor="middle" fill="#7a4a00">translateReport</text></g><g><rect x="378" y="400" width="96" height="26" rx="13" fill="#fff3d6" stroke="#f0a92a"/><text x="426.0" y="417.5" font-size="12" font-weight="600" text-anchor="middle" fill="#7a4a00">translateUi</text></g><g><rect x="482" y="400" width="130" height="26" rx="13" fill="#fff3d6" stroke="#f0a92a"/><text x="547.0" y="417.5" font-size="12" font-weight="600" text-anchor="middle" fill="#7a4a00">translateProfile</text></g><g><rect x="620" y="400" width="158" height="26" rx="13" fill="#fff3d6" stroke="#f0a92a"/><text x="699.0" y="417.5" font-size="12" font-weight="600" text-anchor="middle" fill="#7a4a00">askFollowUpQuestion</text></g><g><rect x="786" y="400" width="100" height="26" rx="13" fill="#fff3d6" stroke="#f0a92a"/><text x="836.0" y="417.5" font-size="12" font-weight="600" text-anchor="middle" fill="#7a4a00">transcribeSpeech</text></g><text x="378" y="448" font-size="12.5" fill="#6b5a3a">processUpload = Storage trigger: runs the whole diagnosis pipeline, then the trend check.</text><text x="378" y="466" font-size="12.5" fill="#6b5a3a">Callables: on-demand translation, one grounded follow-up answer, speech to text,</text><text x="378" y="484" font-size="12.5" fill="#6b5a3a">profile transliteration. minInstances=1 keeps the upload function warm.</text><text x="378" y="510" font-size="12.5" font-weight="700" fill="#245a91">ADK agents (Gemini): </text><text x="510" y="510" font-size="12.5" fill="#4a5f4d">Diagnosis → Advisory (sequential)</text><text x="378" y="528" font-size="12.5" fill="#4a5f4d">Reconciliation · Trend/Alert · Follow-up · Transliteration</text><text x="378" y="546" font-size="12.5" font-weight="700" fill="#2f6b3a">Own model: </text><text x="450" y="546" font-size="12.5" fill="#4a5f4d">MobileNetV2 classifier (TF.js, 38 PlantVillage classes)</text><rect x="364" y="584" width="532" height="180" rx="14" fill="#f4faf1" stroke="#2f6b3a" stroke-width="1.6"/><text x="378" y="608" font-size="15" font-weight="700" fill="#173d24">Pipeline (per photo, in parallel)</text><text x="378" y="630" font-size="12.5" fill="#4a5f4d">1 Gemini vision diagnosis → advice (uses the weather forecast)</text><text x="378" y="648" font-size="12.5" fill="#4a5f4d">2 own classifier second opinion   3 Earth Engine NDVI   4 SoilGrids soil</text><text x="378" y="666" font-size="12.5" fill="#4a5f4d">5 Reconciliation agent settles Gemini vs classifier (rule fallback)</text><text x="378" y="684" font-size="12.5" fill="#4a5f4d">6 write report → Trend agent flags outbreaks (3 reports / 50 km / 7 days)</text><text x="378" y="702" font-size="12.5" fill="#4a5f4d">Optional signals never block a report (timeouts, graceful skips)</text><rect x="970" y="104" width="260" height="72" rx="14" fill="#fff" stroke="#3b7bb8" stroke-width="1.6"/><text x="984" y="128" font-size="15" font-weight="700" fill="#245a91">Gemini API</text><text x="984" y="150" font-size="12.5" fill="#4a5f4d">diagnosis, advice, reconciliation,</text><text x="984" y="168" font-size="12.5" fill="#4a5f4d">follow-up, transliteration</text><rect x="970" y="188" width="260" height="72" rx="14" fill="#fff" stroke="#3b7bb8" stroke-width="1.6"/><text x="984" y="212" font-size="15" font-weight="700" fill="#245a91">Google Earth Engine</text><text x="984" y="234" font-size="12.5" fill="#4a5f4d">MODIS NDVI vegetation health</text><rect x="970" y="272" width="260" height="72" rx="14" fill="#fff" stroke="#3b7bb8" stroke-width="1.6"/><text x="984" y="296" font-size="15" font-weight="700" fill="#245a91">ISRIC SoilGrids</text><text x="984" y="318" font-size="12.5" fill="#4a5f4d">soil organic carbon + pH</text><rect x="970" y="356" width="260" height="72" rx="14" fill="#fff" stroke="#3b7bb8" stroke-width="1.6"/><text x="984" y="380" font-size="15" font-weight="700" fill="#245a91">OpenWeatherMap</text><text x="984" y="402" font-size="12.5" fill="#4a5f4d">forecast used by the advice agent</text><rect x="970" y="440" width="260" height="72" rx="14" fill="#fff" stroke="#3b7bb8" stroke-width="1.6"/><text x="984" y="464" font-size="15" font-weight="700" fill="#245a91">Cloud Translation</text><text x="984" y="486" font-size="12.5" fill="#4a5f4d">report text, UI strings</text><rect x="970" y="524" width="260" height="72" rx="14" fill="#fff" stroke="#3b7bb8" stroke-width="1.6"/><text x="984" y="548" font-size="15" font-weight="700" fill="#245a91">Cloud Speech-to-Text</text><text x="984" y="570" font-size="12.5" fill="#4a5f4d">voice questions</text><rect x="970" y="608" width="260" height="72" rx="14" fill="#fff" stroke="#3b7bb8" stroke-width="1.6"/><text x="984" y="632" font-size="15" font-weight="700" fill="#245a91">Google Maps JS API</text><text x="984" y="654" font-size="12.5" fill="#4a5f4d">map, pins, outbreak circles (browser)</text><rect x="970" y="692" width="260" height="72" rx="14" fill="#fff" stroke="#3b7bb8" stroke-width="1.6"/><text x="984" y="716" font-size="15" font-weight="700" fill="#245a91">Open-Meteo</text><text x="984" y="738" font-size="12.5" fill="#4a5f4d">weather card + backdrop (browser)</text><path id="f1" d="M300 380 C330 380 330 150 362 150" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr-2f6b3a)" class="dash" style="animation-delay:0s"/><circle r="5.5" fill="#2f6b3a"><animateMotion dur="3.2s" begin="0s" repeatCount="indefinite"><mpath href="#f1"/></animateMotion></circle><text x="312" y="232" font-size="12" font-weight="600" fill="#2f6b3a" paint-order="stroke" stroke="#fff" stroke-width="4">login</text><path id="f2" d="M300 430 C330 430 330 255 362 255" fill="none" stroke="#e07a1f" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr-e07a1f)" class="dash" style="animation-delay:0.4s"/><circle r="5.5" fill="#e07a1f"><animateMotion dur="3.4s" begin="0.4s" repeatCount="indefinite"><mpath href="#f2"/></animateMotion></circle><text x="296" y="342" font-size="12" font-weight="600" fill="#e07a1f" paint-order="stroke" stroke="#fff" stroke-width="4">photo upload</text><path id="f3" d="M489 306 L489 326" fill="none" stroke="#e07a1f" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr-e07a1f)" class="dash" style="animation-delay:0.2s"/><circle r="5.5" fill="#e07a1f"><animateMotion dur="1.4s" begin="0.2s" repeatCount="indefinite"><mpath href="#f3"/></animateMotion></circle><path id="f4" d="M772 328 L772 306" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr-2f6b3a)" class="dash" style="animation-delay:0.5s"/><circle r="5.5" fill="#2f6b3a"><animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#f4"/></animateMotion></circle><text x="782" y="320" font-size="12" font-weight="600" fill="#2f6b3a" paint-order="stroke" stroke="#fff" stroke-width="4">report</text><path id="f5" d="M896 440 C930 440 930 140 968 140" fill="none" stroke="#3b7bb8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr-3b7bb8)" class="dash" style="animation-delay:0.3s"/><circle r="5.5" fill="#3b7bb8"><animateMotion dur="4.2s" begin="0.3s" repeatCount="indefinite"><mpath href="#f5"/></animateMotion></circle><path id="f6" d="M896 520 C930 520 930 380 968 380" fill="none" stroke="#3b7bb8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr-3b7bb8)" class="dash" style="animation-delay:0.9s"/><circle r="5.5" fill="#3b7bb8"><animateMotion dur="4.2s" begin="0.9s" repeatCount="indefinite"><mpath href="#f6"/></animateMotion></circle><path id="f7" d="M770 104 V48 H165 V326" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr-2f6b3a)" class="dash" style="animation-delay:0.2s"/><circle r="5.5" fill="#2f6b3a"><animateMotion dur="5s" begin="0.2s" repeatCount="indefinite"><mpath href="#f7"/></animateMotion></circle><text x="300" y="43" font-size="12" font-weight="600" fill="#2f6b3a" paint-order="stroke" stroke="#fff" stroke-width="4">realtime snapshots</text><path id="f8" d="M300 490 C330 490 330 470 362 470" fill="none" stroke="#8a4fc0" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr-8a4fc0)" class="dash" style="animation-delay:0.7s"/><circle r="5.5" fill="#8a4fc0"><animateMotion dur="3s" begin="0.7s" repeatCount="indefinite"><mpath href="#f8"/></animateMotion></circle><text x="306" y="508" font-size="12" font-weight="600" fill="#8a4fc0" paint-order="stroke" stroke="#fff" stroke-width="4">callables</text><path id="f9" d="M165 580 V818 H1100 V766" fill="none" stroke="#8a4fc0" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr-8a4fc0)" class="dash" style="animation-delay:0.1s"/><circle r="5.5" fill="#8a4fc0"><animateMotion dur="6s" begin="0.1s" repeatCount="indefinite"><mpath href="#f9"/></animateMotion></circle><text x="480" y="836" font-size="12" font-weight="600" fill="#8a4fc0" paint-order="stroke" stroke="#fff" stroke-width="4">weather + maps straight from the browser</text></svg>