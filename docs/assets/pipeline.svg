<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
<title id="t">Diagnosis pipeline</title><desc id="d">A photo fans out to Gemini, the own classifier, Earth Engine and SoilGrids in parallel, is reconciled, saved and checked for outbreaks.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f6b3a"/></marker>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#d5ebd0"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
<style>
text{font-family:Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.dash{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-30}}
.lane{animation:lane 8s ease-in-out infinite}
@keyframes lane{0%,12%{fill:#fff}20%,44%{fill:#dff0d8}56%,100%{fill:#fff}}
.step{animation:step 8s ease-in-out infinite}
@keyframes step{0%,50%{fill:#fff}62%,80%{fill:#fff0c8}92%,100%{fill:#fff}}
.alert{animation:alertp 8s ease-in-out infinite}
@keyframes alertp{0%,70%{fill:#fff}80%,95%{fill:#fde0dc}100%{fill:#fff}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}
</style></defs>
<rect width="1280" height="520" fill="#f6f8f2"/>
<text x="640" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#173d24">One photo, several signals, one answer</text>
<g><rect x="30" y="130" width="170" height="220" rx="16" fill="#e6f0e3" stroke="#2f6b3a" stroke-width="1.6"/>
<text x="115" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#173d24">Photo + location</text>
<g transform="translate(115 245) scale(.42)"><path d="M0 -150 C90 -130 140 -40 120 60 C100 150 30 190 0 200 C-30 190 -100 150 -120 60 C-140 -40 -90 -130 0 -150 Z" fill="#3f9b4f"/><path d="M0 -150 L0 200" stroke="#a9e6a2" stroke-width="5"/><circle cx="-40" cy="-20" r="14" fill="#5a3a1a"/><circle cx="35" cy="40" r="18" fill="#5a3a1a"/></g>
<text x="115" y="330" text-anchor="middle" font-size="12" fill="#4a5f4d">phone login required</text></g>
<g><rect x="30" y="392" width="170" height="86" rx="16" fill="#fff8e8" stroke="#e07a1f" stroke-width="1.6"/><text x="115" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4a00">Weather forecast</text><text x="115" y="440" text-anchor="middle" font-size="12" fill="#6b5a3a">OpenWeatherMap, fetched first</text><text x="115" y="458" text-anchor="middle" font-size="12" fill="#6b5a3a">→ tells the advice when to act</text></g>
<rect class="lane" style="animation-delay:0.0s" x="300" y="62" width="360" height="66" rx="14" fill="#fff" stroke="#2f6b3a" stroke-width="1.6"/><text x="316" y="86" font-size="15" font-weight="700" fill="#173d24">Gemini vision → Advisory</text><text x="316" y="106" font-size="12" fill="#4a5f4d">disease · severity · confidence → plain-language advice + regenerative tip</text><path id="a0" d="M200 240 C250 240 250 95 298 95" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-dasharray="6 8" class="dash" marker-end="url(#ar)"/><circle r="5" fill="#ffb04a"><animateMotion dur="2.6s" begin="0.0s" repeatCount="indefinite"><mpath href="#a0"/></animateMotion></circle><path id="b0" d="M660 95 C710 95 710 240 758 240" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-dasharray="6 8" class="dash" marker-end="url(#ar)"/><circle r="5" fill="#ffb04a"><animateMotion dur="2.6s" begin="1.2s" repeatCount="indefinite"><mpath href="#b0"/></animateMotion></circle><rect class="lane" style="animation-delay:0.35s" x="300" y="142" width="360" height="66" rx="14" fill="#fff" stroke="#3b7bb8" stroke-width="1.6"/><text x="316" y="166" font-size="15" font-weight="700" fill="#173d24">Own classifier</text><text x="316" y="186" font-size="12" fill="#4a5f4d">MobileNetV2 (TF.js) second opinion, 38 classes</text><path id="a1" d="M200 240 C250 240 250 175 298 175" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-dasharray="6 8" class="dash" marker-end="url(#ar)"/><circle r="5" fill="#ffb04a"><animateMotion dur="2.6s" begin="0.3s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle><path id="b1" d="M660 175 C710 175 710 240 758 240" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-dasharray="6 8" class="dash" marker-end="url(#ar)"/><circle r="5" fill="#ffb04a"><animateMotion dur="2.6s" begin="1.5s" repeatCount="indefinite"><mpath href="#b1"/></animateMotion></circle><rect class="lane" style="animation-delay:0.7s" x="300" y="222" width="360" height="66" rx="14" fill="#fff" stroke="#3b7bb8" stroke-width="1.6"/><text x="316" y="246" font-size="15" font-weight="700" fill="#173d24">Earth Engine</text><text x="316" y="266" font-size="12" fill="#4a5f4d">MODIS NDVI vegetation health for the location</text><path id="a2" d="M200 240 C250 240 250 255 298 255" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-dasharray="6 8" class="dash" marker-end="url(#ar)"/><circle r="5" fill="#ffb04a"><animateMotion dur="2.6s" begin="0.6s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle><path id="b2" d="M660 255 C710 255 710 240 758 240" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-dasharray="6 8" class="dash" marker-end="url(#ar)"/><circle r="5" fill="#ffb04a"><animateMotion dur="2.6s" begin="1.7999999999999998s" repeatCount="indefinite"><mpath href="#b2"/></animateMotion></circle><rect class="lane" style="animation-delay:1.0499999999999998s" x="300" y="302" width="360" height="66" rx="14" fill="#fff" stroke="#3b7bb8" stroke-width="1.6"/><text x="316" y="326" font-size="15" font-weight="700" fill="#173d24">SoilGrids</text><text x="316" y="346" font-size="12" fill="#4a5f4d">organic carbon + pH at the location</text><path id="a3" d="M200 240 C250 240 250 335 298 335" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-dasharray="6 8" class="dash" marker-end="url(#ar)"/><circle r="5" fill="#ffb04a"><animateMotion dur="2.6s" begin="0.8999999999999999s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle><path id="b3" d="M660 335 C710 335 710 240 758 240" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-dasharray="6 8" class="dash" marker-end="url(#ar)"/><circle r="5" fill="#ffb04a"><animateMotion dur="2.6s" begin="2.0999999999999996s" repeatCount="indefinite"><mpath href="#b3"/></animateMotion></circle><path d="M200 435 C260 435 262 60 298 62" fill="none" stroke="#e07a1f" stroke-width="2" stroke-dasharray="4 7" class="dash" marker-end="url(#ar)"/><text x="300" y="384" font-size="12" fill="#6b5a3a">Optional signals have timeouts and can never block or fail the report.</text><g><rect class="step" x="760" y="150" width="200" height="180" rx="16" fill="#fff" stroke="#8a4fc0" stroke-width="1.6"/>
<text x="776" y="178" font-size="15" font-weight="700" fill="#173d24">Reconciliation agent</text>
<text x="776" y="200" font-size="12" fill="#4a5f4d">Gemini vs own classifier</text><text x="776" y="218" font-size="12" fill="#4a5f4d">tools: compare_symptoms,</text><text x="776" y="236" font-size="12" fill="#4a5f4d">check_class_overlap</text>
<text x="776" y="262" font-size="12" fill="#4a5f4d">agree → keep Gemini</text><text x="776" y="280" font-size="12" fill="#4a5f4d">disagree → reasoned pick</text><text x="776" y="298" font-size="12" fill="#4a5f4d">both unsure → ask a clearer photo</text><text x="776" y="316" font-size="11.5" fill="#8a4fc0">rule-based fallback, never blocks</text></g>
<path id="c1" d="M960 240 C1000 240 1000 200 1040 200" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-dasharray="6 8" class="dash" marker-end="url(#ar)"/><circle r="5" fill="#ffb04a"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></circle>
<g><rect x="1040" y="130" width="210" height="100" rx="16" fill="#fff" stroke="#f0a92a" stroke-width="1.6"/><text x="1056" y="158" font-size="15" font-weight="700" fill="#7a4a00">Firestore report</text><text x="1056" y="180" font-size="12" fill="#4a5f4d">diagnosis · advice · tip · classifier</text><text x="1056" y="198" font-size="12" fill="#4a5f4d">verdict · satellite · soil · uid</text><text x="1056" y="216" font-size="12" fill="#4a5f4d">→ live to every open browser</text></g>
<path id="c2" d="M1145 230 V300" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-dasharray="6 8" class="dash" marker-end="url(#ar)"/><circle r="5" fill="#ffb04a"><animateMotion dur="1.4s" begin=".5s" repeatCount="indefinite"><mpath href="#c2"/></animateMotion></circle>
<g><rect class="alert" x="1040" y="300" width="210" height="130" rx="16" fill="#fff" stroke="#c8402f" stroke-width="1.6"/><text x="1056" y="328" font-size="15" font-weight="700" fill="#c8402f">Trend / Alert agent</text><text x="1056" y="350" font-size="12" fill="#4a5f4d">3+ reports of one disease</text><text x="1056" y="368" font-size="12" fill="#4a5f4d">within 50 km in 7 days</text><text x="1056" y="390" font-size="12" fill="#4a5f4d">→ outbreak ring on the map</text><text x="1056" y="408" font-size="12" fill="#4a5f4d">→ Alerts page + badge</text><circle class="ping" cx="1232" cy="322" r="8" fill="#c8402f" fill-opacity=".5"/><circle cx="1232" cy="322" r="5" fill="#c8402f"/></g>
</svg>